<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="ddlBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#093827"/>
      <stop offset="60%" stop-color="#05261a"/>
      <stop offset="100%" stop-color="#02140d"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdd835"/>
      <stop offset="50%" stop-color="#f5b025"/>
      <stop offset="100%" stop-color="#df9b15"/>
    </linearGradient>

    <!-- Congolese Tricolor Line Gradient -->
    <linearGradient id="congoLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009543"/>
      <stop offset="40%" stop-color="#009543"/>
      <stop offset="45%" stop-color="#fbde4a"/>
      <stop offset="55%" stop-color="#fbde4a"/>
      <stop offset="60%" stop-color="#dc241f"/>
      <stop offset="100%" stop-color="#dc241f"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="36" fill="url(#ddlBg)"/>

  <!-- Subtle Emblem Glow -->
  <circle cx="400" cy="360" r="280" fill="#009543" opacity="0.08"/>

  <!-- ========================================== -->
  <!-- 1. ROOF / CASE CANOPY (CHEVRON AT TOP)     -->
  <!-- ========================================== -->
  <g filter="url(#shadow)">
    <!-- Yellow Gable Crest -->
    <path d="M 400 165 L 435 235 L 400 215 L 365 235 Z" fill="url(#goldGrad)"/>
    <path d="M 400 165 L 495 245 L 460 250 L 400 200 L 340 250 L 305 245 Z" fill="url(#goldGrad)"/>

    <!-- Green Canopy Wings (Left & Right) -->
    <!-- Left Wing -->
    <path d="M 355 170 L 260 210 L 195 210 L 245 250 L 290 245 L 350 205 L 315 190 Z" fill="#008f4c"/>
    <!-- Right Wing -->
    <path d="M 445 170 L 540 210 L 605 210 L 555 250 L 510 245 L 450 205 L 485 190 Z" fill="#008f4c"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. CENTRAL AFRICAN DRUM (TAM-TAM / DJEMBE) -->
  <!-- ========================================== -->
  <g filter="url(#shadow)">
    <!-- Pedestal Base (Red) -->
    <path d="M 380 375 L 360 425 L 440 425 L 420 375 Z" fill="#d62424"/>
    <ellipse cx="400" cy="425" rx="42" ry="10" fill="#c01c1c"/>
    <ellipse cx="400" cy="425" rx="38" ry="7" fill="url(#goldGrad)"/>

    <!-- Gold Rings on Waist -->
    <rect x="376" y="365" width="48" height="6" rx="2" fill="url(#goldGrad)"/>
    <rect x="378" y="373" width="44" height="5" rx="2" fill="url(#goldGrad)"/>

    <!-- Drum Body / Upper Bowl (Red) -->
    <path d="M 345 275 C 342 320, 368 365, 380 375 L 420 375 C 432 365, 458 320, 455 275 Z" fill="#d62424"/>

    <!-- Drum Top Rim (Gold Band) -->
    <ellipse cx="400" cy="275" rx="56" ry="16" fill="url(#goldGrad)"/>
    <!-- Drum Head / Skin (Tanned Cream/Gold) -->
    <ellipse cx="400" cy="273" rx="51" ry="13" fill="#ffe082"/>

    <!-- Traditional Yellow Rope Lacing (Vertical V-Patterns) -->
    <path d="M 352 284 L 380 366 M 364 286 L 384 366 M 378 288 L 392 367 M 392 289 L 400 367 M 406 289 L 408 367 M 420 288 L 416 367 M 434 286 L 420 366 M 446 284 L 424 366" 
          stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. DANCING FIGURES (CONGOLESE COLORS)       -->
  <!-- ========================================== -->

  <!-- Figure 1 (Far Left): Green Dancing Child/Youth -->
  <g fill="#00a352" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="195" cy="330" r="10"/>
    <!-- Torso & Dress/Skirt -->
    <path d="M 195 340 Q 185 365 178 395 L 210 395 Q 200 365 195 340 Z"/>
    <!-- Left Arm raised -->
    <path d="M 192 344 Q 170 338 162 330" stroke="#00a352" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Right Arm raised -->
    <path d="M 198 344 Q 215 335 224 322" stroke="#00a352" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Left Leg running -->
    <path d="M 184 395 Q 176 415 178 435" stroke="#00a352" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Right Leg bent -->
    <path d="M 204 395 Q 215 412 212 425 L 202 432" stroke="#00a352" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Figure 2 (Left): Yellow Dancing Man -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="248" cy="290" r="13"/>
    <!-- Body -->
    <path d="M 248 303 L 236 365 L 258 365 Z"/>
    <!-- Raised Left Arm -->
    <path d="M 243 310 Q 215 285 204 265" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right Arm pointing towards drum -->
    <path d="M 252 312 Q 275 320 282 338" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Left Leg forward -->
    <path d="M 240 365 L 220 435" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Leg back/bent -->
    <path d="M 254 365 L 278 435" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Figure 3 (Center-Left): Red Dancing Woman Silhouette -->
  <g fill="#d62424" filter="url(#shadow)">
    <!-- Head with headdress -->
    <circle cx="328" cy="270" r="12"/>
    <!-- Graceful Arched Torso & Hips -->
    <path d="M 324 282 Q 312 305 328 335 Q 348 365 352 385 L 340 405 Q 318 365 316 335 Q 312 305 324 282 Z"/>
    <!-- Raised arched Arm -->
    <path d="M 323 286 Q 295 280 270 270" stroke="#d62424" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Lower Right Arm -->
    <path d="M 328 290 Q 338 315 348 330" stroke="#d62424" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Flowing Skirt / Legs in motion -->
    <path d="M 345 390 Q 355 415 345 432" stroke="#d62424" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 335 390 Q 315 408 285 412" stroke="#d62424" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Figure 4 (Center-Right): Yellow Dancing Man (Both Arms Up) -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="538" cy="290" r="13"/>
    <!-- Strong Torso -->
    <path d="M 538 303 L 526 365 L 550 365 Z"/>
    <!-- Left Arm Raised High -->
    <path d="M 533 308 Q 508 285 500 268" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right Arm Curved Upward -->
    <path d="M 543 308 Q 575 285 585 270" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Left Leg in power stance -->
    <path d="M 530 365 L 500 435" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Right Leg in step -->
    <path d="M 546 365 L 556 405 L 546 435" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Figure 5 (Far Right): Yellow Dancing Figure -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="608" cy="328" r="11"/>
    <!-- Body -->
    <path d="M 608 339 L 596 395 L 616 395 Z"/>
    <!-- Left Arm down/mid -->
    <path d="M 604 345 Q 578 375 565 365" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Right Arm bent down/back -->
    <path d="M 612 345 Q 635 370 642 385" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Left Leg -->
    <path d="M 600 395 L 570 435" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Right Leg -->
    <path d="M 612 395 L 638 435" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. TRICOLOR DIVIDER BAR                    -->
  <!-- ========================================== -->
  <rect x="160" y="452" width="480" height="4" rx="2" fill="url(#congoLine)"/>

  <!-- ========================================== -->
  <!-- 5. OFFICIAL TYPOGRAPHY                     -->
  <!-- ========================================== -->
  <!-- Top Line: "Diréction Départementale" -->
  <text x="400" y="504" 
        text-anchor="middle" 
        font-family="'Cinzel', 'EB Garamond', Georgia, serif" 
        font-size="43" 
        font-weight="600" 
        letter-spacing="0.5" 
        fill="url(#goldGrad)"
        filter="url(#shadow)">
    Diréction Départementale
  </text>

  <!-- Middle Line: Gold Bars + "DES LOISIRS" -->
  <line x1="165" y1="528" x2="285" y2="528" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="536" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#ffffff"
        filter="url(#shadow)">
    DES LOISIRS
  </text>
  <line x1="515" y1="528" x2="635" y2="528" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Line: "DE POINTE-NOIRE" with Dark Green Box behind DE -->
  <g filter="url(#shadow)">
    <!-- Dark Forest Green Box behind "DE" -->
    <rect x="156" y="546" width="62" height="48" rx="4" fill="#031f15"/>
    <text x="400" y="585" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="url(#goldGrad)">
      DE POINTE-NOIRE
    </text>
  </g>

  <!-- Star & Baseline Accent -->
  <line x1="170" y1="616" x2="380" y2="616" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Red 5-Pointed Star -->
  <polygon points="400,605 404,615 415,615 406,622 410,632 400,625 390,632 394,622 385,615 396,615" fill="#d62424"/>
  <line x1="420" y1="616" x2="630" y2="616" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
