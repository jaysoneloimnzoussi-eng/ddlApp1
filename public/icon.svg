<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="flagCongo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="42%" stop-color="#16a34a"/>
      <stop offset="42%" stop-color="#facc15"/>
      <stop offset="58%" stop-color="#facc15"/>
      <stop offset="58%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Official Outer Shield Ring -->
  <circle cx="256" cy="256" r="190" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="172" fill="#021c17" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- National Republic of Congo Tricolor Core -->
  <circle cx="256" cy="256" r="148" fill="url(#flagCongo)"/>
  <circle cx="256" cy="256" r="130" fill="#022c22" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Central Star of Sovereignty -->
  <path d="M 256,170 L 268,206 L 306,206 L 276,228 L 287,264 L 256,242 L 225,264 L 236,228 L 206,206 L 244,206 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Laurel Wreath Wings -->
  <path d="M 160,280 C 150,330 200,360 256,365 C 312,360 362,330 352,280 C 330,320 290,340 256,342 C 222,340 182,320 160,280 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Institutional Typography Monogram -->
  <text x="256" y="315" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">DDL-PN</text>
  <text x="256" y="338" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="middle" letter-spacing="3">POINTE-NOIRE</text>

  <!-- Top Crown Arch -->
  <text x="256" y="112" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">RÉPUBLIQUE DU CONGO</text>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">MCAPNIT • DGL</text>
</svg>
